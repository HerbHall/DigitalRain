name: Release

# Builds binaries and attaches them to an existing GitHub release.
#
# Normally called by release-please.yml right after Release Please creates a
# release. A tag-push trigger can't be used: tags created with GITHUB_TOKEN do
# not start new workflow runs, so the build would never fire.
# See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
#
# Can also be run by hand (Actions > Release > Run workflow) to backfill
# binaries for a release that is missing them.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. digital_rain-v0.7.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. digital_rain-v0.7.1)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: digital_rain.exe
            archive: digital_rain-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: digital_rain
            archive: digital_rain-linux-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.artifact }}

      - name: Generate SHA256
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            certutil -hashfile "${{ matrix.archive }}" SHA256 | head -2 | tail -1 > "${{ matrix.archive }}.sha256"
          else
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Release Please already created the release and wrote its notes, so
      # this step only uploads files to it (existing notes are kept).
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
